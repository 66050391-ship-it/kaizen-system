<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบเจ้าหน้าที่ - Kaizen System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f4f7fc; font-family: 'Prompt', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card-login { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
  </style>
</head>
<body>

  <div class="card card-login p-4 p-md-5 bg-white">
    <div class="text-center mb-4">
      <i class="fa-solid fa-user-shield fs-1 text-primary mb-2"></i>
      <h4 class="fw-bold">เข้าสู่ระบบเจ้าหน้าที่</h4>
      <p class="text-muted small">สำหรับ Admin และ ทีมงาน Kaizen Shop</p>
    </div>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-bold">ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" class="form-control" name="username" placeholder="เช่น admin หรือ shop" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">รหัสผ่าน (Password)</label>
        <input type="password" class="form-control" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 mb-3">
        <i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ
      </button>
      <div class="text-center">
        <a href="index.html" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i>กลับหน้าแจ้งงานทั่วไป</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          // แยกพาไปคนละหน้าตาม Role
          if (result.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else if (result.user.role === 'shop') {
            window.location.href = 'shop.html';
          }
        } else {
          const alertBox = document.getElementById('alertBox');
          alertBox.innerText = result.error;
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ Server');
      }
    });
  </script>

</body>
</html>
